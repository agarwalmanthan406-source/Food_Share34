{% extends "base.html" %}

{% block title %}Create account — FoodShare{% endblock %}

{% block content %}

<section class="auth-section">
    <div class="auth-container">

        <div class="auth-header">
            <h1 class="auth-title">Create your account</h1>
            <p class="auth-subtitle">Join the fight against food waste</p>
        </div>

        <div class="auth-card">
            {% if error %}
            <div class="auth-error">{{ error }}</div>
            {% endif %}

            <form method="POST" action="/register">
                <div class="form-group">
                    <label for="name">Full name / Organization name</label>
                    <input type="text" id="name" name="name"
                           class="form-input" placeholder="e.g., XYZ Bakery or John Doe"
                           required autofocus>
                </div>
                <div class="form-group">
                    <label for="email">Email address</label>
                    <input type="email" id="email" name="email"
                           class="form-input" placeholder="hello@example.com"
                           required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password"
                           class="form-input" placeholder="Min. 8 characters"
                           required>
                </div>
                
                <!-- NEW: Role Selection (including Admin) -->
                <div class="form-group">
                    <label>How will you use the platform?</label>
                    <div style="display: flex; flex-wrap: wrap; gap: 1.5rem; margin-top: 0.5rem;">
                        <label style="display: flex; align-items: center; gap: 0.4rem; font-weight: normal; color: var(--ink);">
                            <input type="radio" name="role" value="provider" required>
                            I have surplus food
                        </label>
                        <label style="display: flex; align-items: center; gap: 0.4rem; font-weight: normal; color: var(--ink);">
                            <input type="radio" name="role" value="volunteer" required>
                            I want to volunteer
                        </label>
                        <label style="display: flex; align-items: center; gap: 0.4rem; font-weight: normal; color: var(--ink);">
                            <input type="radio" name="role" value="admin" required>
                            Admin
                        </label>
                    </div>
                </div>

                <button type="submit" class="btn-submit">Create account</button>
            </form>
        </div>

        <p class="auth-switch">
            Already have an account?
            <a href="{{ url_for('login') }}">Sign in</a>
        </p>

    </div>
</section>

{% endblock %}
