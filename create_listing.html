{% extends "base.html" %}

{% block title %}Post Food — FoodShare{% endblock %}

{% block content %}
<section class="auth-section">
    <div class="auth-container" style="max-width: 600px;">
        <div class="auth-header">
            <h1 class="auth-title">Post Surplus Food</h1>
            <p class="auth-subtitle">Help reduce waste by listing available food</p>
        </div>

        <div class="auth-card">
            <form method="POST" action="/provider/listings/create">
                <div class="form-group">
                    <label>Food Name</label>
                    <input type="text" name="food_name" class="form-input" placeholder="e.g., Paneer Rice" required>
                </div>
                <div class="form-group">
                    <label>Quantity (Meals/Items)</label>
                    <input type="number" name="quantity" class="form-input" min="1" required>
                </div>
                <div class="form-group">
                    <label>Dietary Type</label>
                    <select name="dietary_type" class="form-input" style="height: 42px; background: var(--paper);">
                        <option value="Vegetarian">Vegetarian</option>
                        <option value="Non-Vegetarian">Non-Vegetarian</option>
                        <option value="Vegan">Vegan</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Pickup Address</label>
                    <input type="text" name="address" class="form-input" placeholder="e.g., E-Block Mess, VIT Chennai" required>
                </div>
                <div class="form-group">
                    <label>Expires At</label>
                    <input type="datetime-local" name="expires_at" class="form-input" required>
                </div>
                <button type="submit" class="btn-submit">Publish Listing</button>
            </form>
        </div>
    </div>
</section>
{% endblock %}
